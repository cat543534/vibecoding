<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyLearnCamp — Полный курс Python</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.0/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e27;--bg2:#131937;--bg3:#1b2149;--panel:#161c40;
  --text:#e8ecf5;--muted:#8b93b8;--accent:#00d1b2;--accent2:#00b89c;
  --success:#23d160;--error:#ff3860;--warn:#ffdd57;
  --border:#2a3160;--code-bg:#0d1230;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
code,pre,textarea.code{font-family:'JetBrains Mono',monospace}

/* Header */
header{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,var(--bg2),rgba(19,25,55,.95));backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#0097a7);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo span{background:linear-gradient(90deg,var(--accent),#4fc3f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.header-progress{flex:1;display:flex;align-items:center;gap:12px;max-width:400px;margin-left:auto}
.progress-bar{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--success));transition:width .4s;border-radius:4px}
.progress-text{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.menu-btn{display:none;background:var(--bg3);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:8px;cursor:pointer;font-size:20px}

/* Layout */
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 68px)}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:20px 0;overflow-y:auto;max-height:calc(100vh - 68px);position:sticky;top:68px}
.sidebar h3{padding:0 20px 12px;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.module{margin-bottom:8px}
.module-title{padding:10px 20px;font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.lesson{padding:10px 20px 10px 32px;font-size:14px;color:var(--muted);cursor:pointer;border-left:3px solid transparent;transition:all .2s;display:flex;align-items:center;gap:10px}
.lesson:hover{background:var(--bg3);color:var(--text)}
.lesson.active{background:var(--bg3);color:var(--accent);border-left-color:var(--accent)}
.lesson.done{color:var(--success)}
.lesson-icon{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.lesson.done .lesson-icon{background:var(--success);border-color:var(--success);color:#fff}
.lesson.done .lesson-icon::after{content:'✓'}

/* Main */
.main{padding:32px 40px;max-width:1200px;width:100%}
.lesson-header{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.lesson-breadcrumb{font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.lesson-title{font-size:32px;font-weight:800;margin-bottom:8px;background:linear-gradient(90deg,#fff,#b0b8d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lesson-desc{color:var(--muted);font-size:15px}

/* Theory */
.theory{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:24px;line-height:1.75}
.theory h2{font-size:22px;margin:20px 0 12px;color:var(--accent)}
.theory h2:first-child{margin-top:0}
.theory h3{font-size:17px;margin:16px 0 10px;color:#fff}
.theory p{margin-bottom:12px;color:#d0d6ec}
.theory ul,.theory ol{margin:10px 0 14px 24px;color:#d0d6ec}
.theory li{margin-bottom:6px}
.theory code{background:var(--code-bg);padding:2px 7px;border-radius:4px;color:var(--accent);font-size:.92em;border:1px solid var(--border)}
.theory pre{background:var(--code-bg);padding:16px;border-radius:8px;overflow-x:auto;margin:12px 0;border:1px solid var(--border)}
.theory pre code{background:transparent;padding:0;border:none;color:var(--text);font-size:13px}
.theory blockquote{border-left:3px solid var(--accent);padding:8px 16px;margin:12px 0;background:rgba(0,209,178,.05);border-radius:0 6px 6px 0;color:#c0c8e0}
.theory strong{color:#fff}
.theory table{width:100%;border-collapse:collapse;margin:12px 0}
.theory th,.theory td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
.theory th{color:var(--accent);font-weight:600}

/* Tasks */
.tasks-section{margin-top:32px}
.tasks-section h2{font-size:20px;margin-bottom:16px;color:var(--accent);display:flex;align-items:center;gap:10px}
.tasks-section h2::before{content:'💻';font-size:24px}
.task{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.task-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.task-title{font-size:17px;font-weight:700}
.task-badge{background:var(--bg3);color:var(--muted);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase}
.task-badge.passed{background:rgba(35,209,96,.15);color:var(--success)}
.task-desc{color:#c0c8e0;margin-bottom:16px;line-height:1.6}
.task-hint{background:rgba(255,221,87,.08);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:14px;font-size:13px;color:#e0d890}

/* Editor */
.editor-wrap{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px}
.editor-toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--bg3);border-bottom:1px solid var(--border)}
.editor-dots{display:flex;gap:6px}
.editor-dots span{width:10px;height:10px;border-radius:50%}
.editor-dots span:nth-child(1){background:#ff5f56}
.editor-dots span:nth-child(2){background:#ffbd2e}
.editor-dots span:nth-child(3){background:#27c93f}
.editor-filename{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
textarea.code{width:100%;min-height:160px;background:transparent;color:var(--text);border:none;padding:16px;font-size:14px;line-height:1.6;resize:vertical;outline:none;tab-size:4}
.editor-actions{display:flex;gap:10px;flex-wrap:wrap}
button{cursor:pointer;font-family:inherit;border:none;border-radius:6px;padding:10px 18px;font-weight:600;font-size:14px;transition:all .2s}
.btn-run{background:var(--accent);color:#000}
.btn-run:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-check{background:linear-gradient(135deg,var(--success),#1ea852);color:#fff}
.btn-check:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(35,209,96,.3)}
.btn-reset{background:var(--bg3);color:var(--muted);border:1px solid var(--border)}
.btn-reset:hover{color:var(--text);border-color:var(--muted)}
.btn-hint{background:transparent;color:var(--warn);border:1px solid var(--warn);padding:8px 14px;font-size:13px}
.btn-hint:hover{background:rgba(255,221,87,.1)}
.btn-nav{background:var(--bg3);color:var(--text);border:1px solid var(--border);padding:12px 20px}
.btn-nav:hover{border-color:var(--accent);color:var(--accent)}

/* Output */
.output{background:#050818;border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:13px;min-height:40px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.output-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:'Inter',sans-serif;font-weight:600}
.output-line{margin-bottom:2px}
.output-line.error{color:var(--error)}
.output-line.success{color:var(--success)}
.output-line.info{color:var(--warn)}
.output-line.loading{color:var(--muted);font-style:italic}

/* Navigation */
.lesson-nav{display:flex;justify-content:space-between;margin-top:32px;padding-top:24px;border-top:1px solid var(--border);gap:10px;flex-wrap:wrap}

/* Certificate */
.certificate{background:linear-gradient(135deg,#1a2555,#0d1230);border:2px solid var(--accent);border-radius:16px;padding:40px;text-align:center;margin:24px 0;position:relative;overflow:hidden}
.certificate::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(0,209,178,.15),transparent 50%),radial-gradient(circle at 80% 70%,rgba(79,195,247,.15),transparent 50%)}
.certificate>*{position:relative}
.cert-title{font-size:14px;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
.cert-main{font-size:36px;font-weight:800;background:linear-gradient(90deg,var(--accent),#4fc3f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px}
.cert-name{font-size:24px;margin:20px 0;color:#fff}
.cert-date{color:var(--muted);font-size:14px;margin-top:16px}
.cert-seal{width:80px;height:80px;margin:20px auto;border:3px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px}

/* Welcome */
.welcome-hero{text-align:center;padding:60px 20px;background:linear-gradient(135deg,var(--panel),var(--bg3));border-radius:16px;margin-bottom:32px;border:1px solid var(--border)}
.welcome-hero h1{font-size:48px;font-weight:800;background:linear-gradient(90deg,var(--accent),#4fc3f7,#b388ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px}
.welcome-hero p{font-size:18px;color:var(--muted);max-width:600px;margin:0 auto 24px}
.welcome-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-top:32px;max-width:600px;margin-left:auto;margin-right:auto}
.stat{background:var(--bg);padding:20px;border-radius:10px;border:1px solid var(--border)}
.stat-num{font-size:28px;font-weight:800;color:var(--accent)}
.stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.btn-start{background:linear-gradient(135deg,var(--accent),#0097a7);color:#000;padding:14px 32px;font-size:16px;font-weight:700;border-radius:8px}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,209,178,.4)}

/* Loading */
.py-loading{position:fixed;inset:0;background:rgba(10,14,39,.9);z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:50px;height:50px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Mobile */
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-100%;top:68px;width:280px;height:calc(100vh - 68px);transition:left .3s;z-index:99}
  .sidebar.open{left:0}
  .menu-btn{display:block}
  .main{padding:20px}
  .lesson-title{font-size:24px}
  .welcome-hero h1{font-size:32px}
}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* Animations */
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<header>
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <div class="logo">
    <div class="logo-icon">🐍</div>
    <div>PyLearn<span>Camp</span></div>
  </div>
  <div class="header-progress">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">0 / 0</div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<div class="py-loading" id="pyLoading" style="display:none">
  <div class="spinner"></div>
  <div style="color:var(--text);font-weight:600">Загружаем Python...</div>
  <div style="color:var(--muted);font-size:13px">Первый запуск может занять несколько секунд</div>
</div>

<script>
// ============ COURSE DATA ============
const course = {
  title: "Полный курс Python",
  modules: [
    {
      title: "Основы Python",
      lessons: [
        {
          id: "intro",
          title: "Введение в Python",
          desc: "Что такое Python и почему его стоит изучить",
          theory: `
<h2>Добро пожаловать в мир Python!</h2>
<p><strong>Python</strong> — это высокоуровневый язык программирования общего назначения, созданный Гвидо ван Россумом в 1991 году. Он отличается простым и читаемым синтаксисом, что делает его идеальным для начинающих.</p>
<h3>Где используется Python?</h3>
<ul>
  <li><strong>Веб-разработка:</strong> Django, Flask, FastAPI</li>
  <li><strong>Data Science:</strong> pandas, NumPy, matplotlib</li>
  <li><strong>Машинное обучение:</strong> TensorFlow, PyTorch, scikit-learn</li>
  <li><strong>Автоматизация:</strong> скрипты, боты, парсинг</li>
  <li><strong>Разработка игр:</strong> Pygame</li>
</ul>
<h3>Первая программа</h3>
<p>Традиционно изучение любого языка начинается с программы <code>Hello, World!</code>:</p>
<pre><code class="language-python">print("Hello, World!")
print("Добро пожаловать в Python!")</code></pre>
<blockquote>Функция <code>print()</code> выводит текст на экран. Текст заключается в кавычки — одинарные или двойные.</blockquote>
<h3>Комментарии</h3>
<p>Комментарии помогают объяснить код. Они игнорируются интерпретатором:</p>
<pre><code class="language-python"># Это однострочный комментарий
print("Привет")  # Комментарий после кода

"""
Это многострочный
комментарий (docstring)
"""</code></pre>
`,
          tasks: [
            {
              title: "Hello, World!",
              desc: "Напишите программу, которая выводит текст <code>Hello, World!</code> на экран.",
              starter: '# Напишите ваш код здесь\n',
              solution: 'print("Hello, World!")',
              test: `output == "Hello, World!\\n"`,
              hint: "Используйте функцию print() с текстом в кавычках"
            },
            {
              title: "Мой первый вывод",
              desc: "Выведите на экран две строки: <code>Меня зовут Python</code> и <code>Мне 30+ лет</code> (каждая на новой строке).",
              starter: '# Выведите две строки\n',
              solution: 'print("Меня зовут Python")\nprint("Мне 30+ лет")',
              test: `output.includes("Меня зовут Python") && output.includes("Мне 30+ лет")`,
              hint: "Используйте два вызова print() или один с символом \\n"
            }
          ]
        },
        {
          id: "variables",
          title: "Переменные и типы данных",
          desc: "Учимся хранить данные в переменных",
          theory: `
<h2>Переменные в Python</h2>
<p><strong>Переменная</strong> — это именованная область памяти, которая хранит значение. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
<pre><code class="language-python">name = "Алиса"       # строка (str)
age = 25             # целое число (int)
height = 1.68        # дробное число (float)
is_student = True    # логическое значение (bool)</code></pre>
<h3>Правила именования</h3>
<ul>
  <li>Имя может содержать буквы, цифры и символ подчёркивания <code>_</code></li>
  <li>Не может начинаться с цифры</li>
  <li>Регистр имеет значение: <code>name</code> и <code>Name</code> — разные переменные</li>
  <li>Нельзя использовать ключевые слова Python (<code>if</code>, <code>for</code>, <code>class</code> и т.д.)</li>
</ul>
<h3>Типы данных</h3>
<table>
  <tr><th>Тип</th><th>Описание</th><th>Пример</th></tr>
  <tr><td>int</td><td>Целое число</td><td>42, -7, 0</td></tr>
  <tr><td>float</td><td>Дробное число</td><td>3.14, -0.5</td></tr>
  <tr><td>str</td><td>Строка</td><td>"Привет"</td></tr>
  <tr><td>bool</td><td>Логический</td><td>True, False</td></tr>
  <tr><td>NoneType</td><td>Пустое значение</td><td>None</td></tr>
</table>
<h3>Проверка типа</h3>
<p>Функция <code>type()</code> возвращает тип объекта:</p>
<pre><code class="language-python">x = 42
print(type(x))  # &lt;class 'int'&gt;

y = "hello"
print(type(y))  # &lt;class 'str'&gt;</code></pre>
<h3>Преобразование типов</h3>
<pre><code class="language-python"># Строку в число
num_str = "123"
num = int(num_str)    # 123
flt = float("3.14")   # 3.14

# Число в строку
age = 25
text = str(age)       # "25"</code></pre>
`,
          tasks: [
            {
              title: "Создание переменных",
              desc: "Создайте переменные <code>name</code> со значением <code>"Python"</code> и <code>version</code> со значением <code>3</code>. Выведите их через пробел.",
              starter: '# Создайте переменные\n\n# Выведите их\n',
              solution: 'name = "Python"\nversion = 3\nprint(name, version)',
              test: `output.trim() === "Python 3"`,
              hint: "Используйте print(name, version) — print автоматически добавит пробел"
            },
            {
              title: "Типы данных",
              desc: "Создайте переменные: <code>a</code> — целое число 10, <code>b</code> — дробное 2.5, <code>c</code> — строка \"hi\". Выведите их типы через <code>type()</code> (каждый на новой строке).",
              starter: '# Создайте переменные a, b, c\n\n# Выведите их типы\n',
              solution: 'a = 10\nb = 2.5\nc = "hi"\nprint(type(a))\nprint(type(b))\nprint(type(c))',
              test: `output.includes("int") && output.includes("float") && output.includes("str")`,
              hint: "Используйте print(type(переменная)) для каждой переменной"
            }
          ]
        },
        {
          id: "strings",
          title: "Работа со строками",
          desc: "Строки: создание, методы, форматирование",
          theory: `
<h2>Строки в Python</h2>
<p>Строка (<code>str</code>) — это последовательность символов. Строки можно создавать с помощью одинарных или двойных кавычек.</p>
<pre><code class="language-python">s1 = 'Привет'
s2 = "Мир"
s3 = """Многострочная
строка"""</code></pre>
<h3>Операции со строками</h3>
<pre><code class="language-python"># Конкатенация (склеивание)
s = "Привет" + ", " + "Мир!"  # "Привет, Мир!"

# Повторение
s = "Ха" * 3  # "ХаХаХа"

# Длина строки
len("Python")  # 6</code></pre>
<h3>Индексация и срезы</h3>
<pre><code class="language-python">s = "Python"
print(s[0])     # 'P' — первый символ
print(s[-1])    # 'n' — последний
print(s[0:3])   # 'Pyt' — срез с 0 по 2
print(s[::2])   # 'Pto' — каждый второй</code></pre>
<h3>Полезные методы строк</h3>
<pre><code class="language-python">s = "Hello, World!"

s.upper()        # "HELLO, WORLD!"
s.lower()        # "hello, world!"
s.title()        # "Hello, World!"

// ============ STATE ============
let state = {
  currentLesson: null,
  progress: JSON.parse(localStorage.getItem('pylearn_progress') || '{}'),
  pyodide: null,
  pyodideLoading: false,
  taskOutputs: {},
  taskPassed: {}
};

// ============ UTILS ============
function getAllLessons() {
  const lessons = [];
  course.modules.forEach(m => m.lessons.forEach(l => lessons.push({...l, module: m.title})));
  return lessons;
}

function saveProgress() {
  localStorage.setItem('pylearn_progress', JSON.stringify(state.progress));
  updateProgress();
}

function updateProgress() {
  const all = getAllLessons();
  const done = all.filter(l => state.progress[l.id]).length;
  const pct = all.length ? Math.round(done / all.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${all.length}`;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ============ RENDER SIDEBAR ============
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '<h3>Программа курса</h3>';
  course.modules.forEach((m, mi) => {
    html += `<div class="module"><div class="module-title">${mi+1}. ${m.title}</div>`;
    m.lessons.forEach(l => {
      const active = state.currentLesson === l.id ? 'active' : '';
      const done = state.progress[l.id] ? 'done' : '';
      html += `<div class="lesson ${active} ${done}" onclick="loadLesson('${l.id}')">
        <div class="lesson-icon"></div>
        <span>${l.title}</span>
      </div>`;
    });
    html += '</div>';
  });
  sb.innerHTML = html;
}

// ============ RENDER WELCOME ============
function renderWelcome() {
  const main = document.getElementById('main');
  const all = getAllLessons();
  const done = all.filter(l => state.progress[l.id]).length;
  const totalTasks = all.reduce((s, l) => s + l.tasks.length, 0);
  main.innerHTML = `
    <div class="welcome-hero fade-in">
      <h1>🐍 Изучайте Python бесплатно</h1>
      <p>Интерактивный курс с реальным выполнением кода в браузере. От основ до продвинутых тем — с практическими задачами.</p>
      <button class="btn-start" onclick="loadLesson('${all[0].id}')">
        ${done > 0 ? 'Продолжить обучение' : 'Начать обучение'} →
      </button>
      <div class="welcome-stats">
        <div class="stat"><div class="stat-num">${course.modules.length}</div><div class="stat-label">Модулей</div></div>
        <div class="stat"><div class="stat-num">${all.length}</div><div class="stat-label">Уроков</div></div>
        <div class="stat"><div class="stat-num">${totalTasks}</div><div class="stat-label">Задач</div></div>
        <div class="stat"><div class="stat-num">${done}</div><div class="stat-label">Пройдено</div></div>
      </div>
    </div>
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px">
      <h2 style="color:var(--accent);margin-bottom:16px">📚 Что вас ждёт</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px">
        <div><strong>🎯 Практика</strong><p style="color:var(--muted);margin-top:4px;font-size:14px">Каждый урок содержит задачи с проверкой</p></div>
        <div><strong>⚡ Реальный Python</strong><p style="color:var(--muted);margin-top:4px;font-size:14px">Код выполняется прямо в браузере через Pyodide</p></div>
        <div><strong>💾 Прогресс</strong><p style="color:var(--muted);margin-top:4px;font-size:14px">Автоматическое сохранение достижений</p></div>
        <div><strong>🏆 Сертификат</strong><p style="color:var(--muted);margin-top:4px;font-size:14px">Получите сертификат по завершении курса</p></div>
      </div>
    </div>
  `;
}

// ============ LOAD LESSON ============
function loadLesson(id) {
  state.currentLesson = id;
  state.taskOutputs = {};
  state.taskPassed = {};
  renderSidebar();
  renderLesson();
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0, 0);
}

function renderLesson() {
  const lesson = getAllLessons().find(l => l.id === state.currentLesson);
  if (!lesson) return renderWelcome();
  const allLessons = getAllLessons();
  const idx = allLessons.findIndex(l => l.id === lesson.id);
  const prev = idx > 0 ? allLessons[idx-1] : null;
  const next = idx < allLessons.length - 1 ? allLessons[idx+1] : null;

  const main = document.getElementById('main');
  let tasksHtml = '';
  lesson.tasks.forEach((t, ti) => {
    const taskKey = `${lesson.id}_${ti}`;
    const passed = state.progress[taskKey];
    tasksHtml += `
      <div class="task fade-in" id="task-${ti}">
        <div class="task-header">
          <div class="task-title">Задача ${ti+1}: ${t.title}</div>
          <div class="task-badge ${passed ? 'passed' : ''}">${passed ? '✓ Решено' : 'Задача'}</div>
        </div>
        <div class="task-desc">${t.desc}</div>
        <div class="editor-wrap">
          <div class="editor-toolbar">
            <div class="editor-dots"><span></span><span></span><span></span></div>
            <div class="editor-filename">task_${ti+1}.py</div>
          </div>
          <textarea class="code" id="code-${ti}" spellcheck="false">${t.starter}</textarea>
        </div>
        <div class="editor-actions">
          <button class="btn-run" onclick="runCode(${ti})">▶ Запустить</button>
          <button class="btn-check" onclick="checkTask(${ti})">✓ Проверить</button>
          <button class="btn-reset" onclick="resetCode(${ti})">↺ Сброс</button>
          <button class="btn-hint" onclick="showHint(${ti})">💡 Подсказка</button>
        </div>
        <div class="output-label" style="margin-top:12px">Вывод:</div>
        <div class="output" id="output-${ti}"><span class="output-line loading">Нажмите "Запустить" для выполнения кода</span></div>
        <div id="hint-${ti}" style="display:none" class="task-hint">💡 ${t.hint}</div>
      </div>
    `;
  });

  main.innerHTML = `
    <div class="lesson-header fade-in">
      <div class="lesson-breadcrumb">${lesson.module}</div>
      <h1 class="lesson-title">${lesson.title}</h1>
      <p class="lesson-desc">${lesson.desc}</p>
    </div>
    <div class="theory fade-in">${lesson.theory}</div>
    <div class="tasks-section">
      <h2>Практические задачи</h2>
      ${tasksHtml}
    </div>
    <div class="lesson-nav">
      ${prev ? `<button class="btn-nav" onclick="loadLesson('${prev.id}')">← ${prev.title}</button>` : '<div></div>'}
      ${next ? `<button class="btn-nav" onclick="loadLesson('${next.id}')">Следующий: ${next.title} →</button>` : '<button class="btn-start" onclick="showCertificate()">Получить сертификат 🏆</button>'}
    </div>
  `;

  // Подсветка синтаксиса в теории
  if (window.Prism) Prism.highlightAllUnder(main);

  // Tab в textarea
  lesson.tasks.forEach((t, ti) => {
    const ta = document.getElementById(`code-${ti}`);
    ta.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = ta.selectionStart, end = ta.selectionEnd;
        ta.value = ta.value.substring(0, s) + '    ' + ta.value.substring(end);
        ta.selectionStart = ta.selectionEnd = s + 4;
      }
    });
  });
}

// ============ PYODIDE ============
async function ensurePyodide() {
  if (state.pyodide) return state.pyodide;
  if (state.pyodideLoading) {
    while (!state.pyodide) await new Promise(r => setTimeout(r, 200));
    return state.pyodide;
  }
  state.pyodideLoading = true;
  document.getElementById('pyLoading').style.display = 'flex';
  try {
    state.pyodide = await loadPyodide();
    state.pyodide.setStdout({batched: (s) => { state._stdout += s + '\n'; }});
    state.pyodide.setStderr({batched: (s) => { state._stderr += s + '\n'; }});
  } finally {
    state.pyodideLoading = false;
    document.getElementById('pyLoading').style.display = 'none';
  }
  return state.pyodide;
}

async function runPython(code) {
  const py = await ensurePyodide();
  state._stdout = '';
  state._stderr = '';
  try {
    await py.runPythonAsync(code);
    return { success: true, stdout: state._stdout, stderr: state._stderr };
  } catch (e) {
    return { success: false, stdout: state._stdout, stderr: state._stderr + '\n' + e.message, error: e.message };
  }
}

// ============ TASK ACTIONS ============
function getLesson() {
  return getAllLessons().find(l => l.id === state.currentLesson);
}

async function runCode(ti) {
  const lesson = getLesson();
  const code = document.getElementById(`code-${ti}`).value;
  const out = document.getElementById(`output-${ti}`);
  out.innerHTML = '<span class="output-line loading">⏳ Выполняется...</span>';
  const result = await runPython(code);
  let html = '';
  if (result.stdout) html += result.stdout.split('\n').filter(l => l).map(l => `<div class="output-line">${escapeHtml(l)}</div>`).join('');
  if (result.stderr) html += result.stderr.split('\n').filter(l => l).map(l => `<div class="output-line error">${escapeHtml(l)}</div>`).join('');
  if (!html) html = '<span class="output-line info">(нет вывода)</span>';
  out.innerHTML = html;
  state.taskOutputs[ti] = result.stdout || '';
}

async function checkTask(ti) {
  const lesson = getLesson();
  const task = lesson.tasks[ti];
  const code = document.getElementById(`code-${ti}`).value;
  const out = document.getElementById(`output-${ti}`);
  out.innerHTML = '<span class="output-line loading">⏳ Проверяем...</span>';

  const result = await runPython(code);
  const output = result.stdout || '';
  state.taskOutputs[ti] = output;

  let passed = false;
  let checkResult = '';
  try {
    const py = await ensurePyodide();
    py.globals.set('output', output);
    passed = await py.runPythonAsync(task.test);
    passed = py.globals.get('_result') !== undefined ? py.globals.get('_result') : passed;
    // runPythonAsync возвращает None для выражений, нужно через eval
    const evalCode = `_result = bool(${task.test})`;
    await py.runPythonAsync(evalCode);
    passed = py.globals.get('_result');
  } catch (e) {
    checkResult = e.message;
    passed = false;
  }

  let html = '';
  if (result.stdout) html += result.stdout.split('\n').filter(l => l).map(l => `<div class="output-line">${escapeHtml(l)}</div>`).join('');
  if (result.stderr) html += result.stderr.split('\n').filter(l => l).map(l => `<div class="output-line error">${escapeHtml(l)}</div>`).join('');

  if (passed) {
    html += '<div class="output-line success">✓ Задача решена верно!</div>';
    const taskKey = `${lesson.id}_${ti}`;
    state.progress[taskKey] = true;
    // Проверить, все ли задачи урока решены
    const allSolved = lesson.tasks.every((_, i) => state.progress[`${lesson.id}_${i}`]);
    if (allSolved) {
      state.progress[lesson.id] = true;
      html += '<div class="output-line success">🎉 Урок пройден полностью!</div>';
    }
    saveProgress();
    renderSidebar();
    // Обновить бейдж
    const badge = document.querySelector(`#task-${ti} .task-badge`);
    if (badge) {
      badge.classList.add('passed');
      badge.textContent = '✓ Решено';
    }
  } else {
    html += '<div class="output-line error">✗ Неверно. Попробуйте ещё раз.</div>';
    if (checkResult) html += `<div class="output-line error">${escapeHtml(checkResult)}</div>`;
  }
  out.innerHTML = html;
}

function resetCode(ti) {
  const lesson = getLesson();
  document.getElementById(`code-${ti}`).value = lesson.tasks[ti].starter;
  document.getElementById(`output-${ti}`).innerHTML = '<span class="output-line loading">Код сброшен. Нажмите "Запустить"</span>';
  document.getElementById(`hint-${ti}`).style.display = 'none';
}

function showHint(ti) {
  const h = document.getElementById(`hint-${ti}`);
  h.style.display = h.style.display === 'none' ? 'block' : 'none';
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ============ CERTIFICATE ============
function showCertificate() {
  const all = getAllLessons();
  const done = all.filter(l => state.progress[l.id]).length;
  const main = document.getElementById('main');
  const name = localStorage.getItem('pylearn_name') || '';

  if (done < all.length) {
    main.innerHTML = `
      <div class="certificate fade-in">
        <div class="cert-title">Почти готово!</div>
        <div class="cert-main">Осталось пройти уроки</div>
        <p style="color:var(--muted);font-size:16px;margin:20px 0">Вы прошли ${done} из ${all.length} уроков. Завершите все уроки, чтобы получить сертификат.</p>
        <div style="margin-top:20px">
          <div class="progress-bar" style="max-width:400px;margin:0 auto;height:12px">
            <div class="progress-fill" style="width:${Math.round(done/all.length*100)}%"></div>
          </div>
          <p style="color:var(--muted);margin-top:10px">${done} / ${all.length}</p>
        </div>
        <button class="btn-start" style="margin-top:20px" onclick="loadLesson('${all.find(l => !state.progress[l.id]).id}')">Продолжить обучение</button>
      </div>
    `;
    return;
  }

  main.innerHTML = `
    <div class="certificate fade-in">
      <div class="cert-title">Сертификат</div>
      <div class="cert-main">Полный курс Python</div>
      <div class="cert-seal">🏆</div>
      <p style="color:var(--muted)">Настоящий сертификат подтверждает, что</p>
      <div class="cert-name" id="certName">${name || 'Введите ваше имя'}</div>
      <p style="color:var(--muted);max-width:500px;margin:16px auto">успешно завершил(а) полный интерактивный курс Python, включающий ${all.length} уроков и все практические задания.</p>
      <div class="cert-date">Выдан: ${new Date().toLocaleDateString('ru-RU', {day:'numeric',month:'long',year:'numeric'})}</div>
      ${!name ? `<div style="margin-top:20px"><input id="certInput" placeholder="Ваше имя" style="padding:10px 14px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;font-family:inherit;margin-right:8px"><button class="btn-run" onclick="saveCertName()">Сохранить</button></div>` : ''}
    </div>
  `;
}

function saveCertName() {
  const name = document.getElementById('certInput').value.trim();
  if (name) {
    localStorage.setItem('pylearn_name', name);
    showCertificate();
  }
}

// ============ INIT ============
renderSidebar();
updateProgress();
renderWelcome();

// Предзагрузка Pyodide при первом взаимодействии
let preloadTriggered = false;
document.addEventListener('click', () => {
  if (!preloadTriggered) {
    preloadTriggered = true;
    ensurePyodide().catch(e => console.warn('Pyodide preload failed', e));
  }
}, { once: true });
</script>
